- title: "A Bibliometric Analysis of Top-Cited Studies on Graph Theory–Based Resting-State fMRI in ADHD and Generalized Anxiety Disorder"
  date: "March 2026"
  date_iso: "2026-03-01"
  excerpt: "A collaboration examining the contribution and current direction of graph theory–based resting-state fMRI in ADHD and generalized anxiety disorder through bibliometric analysis of top 100 most cited papers."
  slug: "bibliometric-graph-theory-fmri-adhd-gad"
  kind: "Bibliometric analysis"
  imageDir: "/blog/bibliometric-graph-theory-fmri-adhd-gad/images"
  authors:
    - "M.Qara Ali"
    - "R. Yin"
    - "S.Chen"
    - "V.Bommisetty"
    - "M.Srivastava"
    - "S.Shindadkar"
    - "T.Sriram"
    - "H.Dilip"
    - "Z.Nasir"
    - "H.Janjua"
  tags:
    - Neuroscience
    - fMRI
    - Graph Theory
    - ADHD
    - Anxiety
    - Research
  sections:
    - type: paragraph
      text: "Attention Deficit Hyperactivity Disorder (ADHD) and Generalized Anxiety Disorder are two psychiatric disorders with overlapping symptoms such as inattention, restlessness, and executive dysfunction, which complicates clinical differentiation. Graph theory–based approaches using resting-state fMRI are commonly used to study functional brain connectivity in these conditions. However, these studies often examine the disorders separately or in transdiagnostic samples, so it remains unclear what measures can differentiate ADHD from GAD. This bibliometric analysis identifies gaps in graph-theoretic resting-state fMRI research between these two disorders."
    - type: figure
      image: "figure1.jpg"
      alt: "Overlapping symptoms between ADHD and anxiety disorders"
      caption: "Figure 1: Overlapping symptoms between ADHD and anxiety disorders contribute to diagnostic challenges¹"
    - type: paragraph
      text: "This study aims to perform a bibliometric analysis of the top 100 most cited papers to evaluate the contribution and current direction of graph theory–based resting-state fMRI in ADHD and generalized anxiety disorder."
    - type: paragraph
      text: "Web of Science (WoS) was used to identify the top 100 most cited articles on fMRI in ADHD and GAD. Data on authorship, institutional affiliation, journal distribution, and citation metrics were extracted. Analysis and visualization were performed using Excel and R."
    - type: figure
      image: "figure2.jpg"
      alt: "Study selection workflow showing identification and screening of articles from Web of Science"
      caption: "Figure 2: Study selection workflow showing identification and screening of articles from Web of Science, resulting in 100 eligible studies (78 articles and 22 reviews)."
    - type: paragraph
      text: "Research output was concentrated among highly cited authors and major academic institutions. Keyword analysis revealed strong overlap between ADHD, functional connectivity, and network analysis, while anxiety-related terms appeared less frequently. Graph-theoretic approaches have been used to distinguish GAD from healthy controls; however, few studies directly compare ADHD and GAD using this framework."
    - type: figure
      image: "figure3.jpg"
      alt: "Senior Author Institutions with multiple papers of the top 100 most cited papers on graph theory-based resting-state fMRI network analysis in ADHD and GAD"
      caption: "Figure 3: Senior Author Institutions with multiple papers of the top 100 most cited papers on graph theory-based resting-state fMRI network analysis in ADHD and GAD."
    - type: figure
      image: "figure4.jpg"
      alt: "Journals with multiple top-100 cited articles"
      caption: "Figure 4: Journals with multiple top-100 cited articles. Top journals: NeuroImage, Molecular Psychiatry, Imaging Neuroscience"
    - type: paragraph
      text: "Graph theory–based resting-state fMRI is an established and methodologically consistent framework for studying ADHD. However, GAD remains underrepresented in this literature, with few studies directly comparing ADHD and GAD using graph-theoretic approaches. This highlights a key gap in current research."
    - type: paragraph
      text: "This bibliometric analysis highlights a key gap: while graph theory–based resting-state fMRI is well established in ADHD research, its application to GAD and direct ADHD–GAD comparison remains limited. Addressing this gap could improve diagnostic accuracy in populations where these conditions overlap. Future research should focus on applying graph-theoretic network measures to publicly available datasets to support neuroimaging-based differential diagnosis."
  references:
